<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitados · Baby Shower de Evangeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F9E4EA; --paper:#FFF8FA; --line:#F0C6D1; --rose:#B5566A; --wine:#6E2A3A;
  --ink:#4E2230; --muted:#8C5E6B; --sky:#A9CBE6; --ok:#4F8A6E; --no:#9A8A90; --wait:#C78A2E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#241820; --paper:#33222C; --line:#56394A; --ink:#F7DCE4; --muted:#C9A3B0; --rose:#E48DA0; --wine:#F2C9D3; }
}
:root[data-theme="dark"]{ --bg:#241820; --paper:#33222C; --line:#56394A; --ink:#F7DCE4; --muted:#C9A3B0; --rose:#E48DA0; --wine:#F2C9D3; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Quicksand","Trebuchet MS",system-ui,sans-serif; }
main{ max-width:760px; margin:0 auto; padding:2rem 1.1rem 4rem; }

header{ text-align:center; margin-bottom:1.6rem; }
header h1{ font-family:"Parisienne",cursive; font-weight:400; color:var(--rose); font-size:clamp(2.6rem,11vw,3.8rem); margin:0; line-height:1.1; }
header p{ margin:.2rem 0 0; color:var(--muted); font-weight:500; }

.tally{ display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; margin-bottom:1.4rem; }
.tally div{ background:var(--paper); border-radius:1.2rem; padding:.9rem .6rem; text-align:center; border:1.5px solid var(--line); }
.tally b{ display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:2.3rem; line-height:1; color:var(--wine); font-variant-numeric:tabular-nums; }
.tally span{ font-size:.85rem; color:var(--muted); font-weight:600; }
.tally .main{ background:var(--rose); border-color:var(--rose); }
.tally .main b, .tally .main span{ color:#fff; }

.panel{ background:var(--paper); border-radius:1.6rem; padding:1.2rem; border:1.5px solid var(--line); margin-bottom:1.2rem; }
.panel h2{ font-family:"Cormorant Garamond",Georgia,serif; font-size:1.45rem; margin:0 0 .8rem; color:var(--wine); }

form.add{ display:grid; grid-template-columns:2fr 1fr 1.3fr; gap:.6rem; align-items:end; }
form.add .full{ grid-column:1/-1; }
label{ font-size:.85rem; font-weight:600; color:var(--muted); display:block; }
input, select, textarea{
  width:100%; font:inherit; font-size:1rem; color:var(--ink); background:var(--bg);
  border:1.5px solid var(--line); border-radius:.9rem; padding:.62rem .8rem; margin-top:.25rem;
}
textarea{ resize:vertical; min-height:3.2rem; }
.row-actions{ grid-column:1/-1; display:flex; gap:.6rem; flex-wrap:wrap; justify-content:flex-end; }

.btn{ font:inherit; font-weight:700; font-size:.95rem; cursor:pointer; border-radius:999px; padding:.65rem 1.2rem;
  border:1.5px solid var(--rose); background:transparent; color:var(--rose); }
.btn:hover{ background:var(--rose); color:#fff; }
.btn.primary{ background:var(--rose); color:#fff; }
.btn.primary:hover{ background:var(--wine); border-color:var(--wine); color:var(--paper); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
:focus-visible{ outline:3px solid var(--sky); outline-offset:2px; }

details.paste{ margin-top:.9rem; }
details.paste summary{ cursor:pointer; font-weight:600; color:var(--rose); font-size:.95rem; }
details.paste p{ font-size:.88rem; color:var(--muted); margin:.5rem 0; }

.toolbar{ display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin-bottom:.8rem; }
.toolbar input{ flex:1 1 180px; margin:0; }
.chips{ display:flex; gap:.35rem; flex-wrap:wrap; }
.chip{ font:inherit; font-size:.85rem; font-weight:600; border-radius:999px; padding:.4rem .8rem; cursor:pointer;
  border:1.5px solid var(--line); background:transparent; color:var(--muted); }
.chip[aria-pressed="true"]{ background:var(--wine); border-color:var(--wine); color:var(--paper); }

ul.list{ list-style:none; margin:0; padding:0; }
ul.list li{ display:grid; grid-template-columns:1fr auto; gap:.3rem .8rem; padding:.85rem .2rem; border-top:1.5px dashed var(--line); }
ul.list li:first-child{ border-top:0; }
.who{ font-weight:700; font-size:1.05rem; }
.who small{ font-weight:500; color:var(--muted); margin-left:.3rem; }
.note{ grid-column:1/2; font-size:.9rem; color:var(--muted); }
.ctrls{ grid-row:1/3; grid-column:2; display:flex; gap:.4rem; align-items:center; }
.status{ font:inherit; font-size:.85rem; font-weight:700; border-radius:999px; padding:.35rem .5rem; margin:0; width:auto; border-width:1.5px; }
.status[data-s="confirmado"]{ color:var(--ok); border-color:var(--ok); }
.status[data-s="pendiente"]{ color:var(--wait); border-color:var(--wait); }
.status[data-s="no asiste"]{ color:var(--no); border-color:var(--no); }
.icon{ font:inherit; background:none; border:0; cursor:pointer; font-size:1.05rem; padding:.3rem; border-radius:.5rem; color:var(--muted); }
.icon:hover{ background:var(--bg); }

.empty{ text-align:center; color:var(--muted); padding:1.6rem .5rem; }
.banner{ font-size:.9rem; padding:.7rem 1rem; border-radius:1rem; margin-bottom:1rem; background:var(--paper); border:1.5px solid var(--wait); color:var(--ink); display:none; }
.banner.show{ display:block; }
.foot{ display:flex; justify-content:space-between; gap:.6rem; flex-wrap:wrap; align-items:center; margin-top:.8rem; }
.foot small{ color:var(--muted); }
.sync{ display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; justify-content:space-between; }
.sync .state{ font-size:.9rem; font-weight:600; color:var(--muted); }
.sync .state::before{ content:""; display:inline-block; width:.6rem; height:.6rem; border-radius:50%; background:var(--no); margin-right:.45rem; vertical-align:middle; }
.sync .state[data-on="true"]::before{ background:var(--ok); }
.sync form{ display:flex; gap:.5rem; flex:1 1 260px; }
.sync form input{ margin:0; }
.sync .acts{ display:flex; gap:.4rem; flex-wrap:wrap; }
.sync [hidden], .panel[hidden]{ display:none !important; }

@media (max-width:560px){
  form.add{ grid-template-columns:1fr 1fr; }
  form.add .name{ grid-column:1/-1; }
  ul.list li{ grid-template-columns:1fr; }
  .ctrls{ grid-row:auto; grid-column:1; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Lista de invitados</h1>
    <p>Baby shower de Evangeline · domingo 11 de octubre</p>
  </header>

  <div class="banner" id="banner" role="status"></div>

  <section class="panel sync" id="syncPanel" hidden>
    <span class="state" id="syncState" data-on="false">Sin conectar a Google Sheets</span>
    <form id="keyForm" autocomplete="off">
      <input type="password" id="keyInput" placeholder="Clave de anfitrión" aria-label="Clave de anfitrión" autocomplete="current-password">
      <button class="btn primary" type="submit">Conectar</button>
    </form>
    <div class="acts" id="syncActs" hidden>
      <button class="btn" type="button" id="refreshBtn">Actualizar</button>
      <button class="btn" type="button" id="forgetBtn">Olvidar clave</button>
    </div>
  </section>

  <section class="tally" aria-label="Resumen">
    <div class="main"><b id="t-people">0</b><span>personas confirmadas</span></div>
    <div><b id="t-pending">0</b><span>por responder</span></div>
    <div><b id="t-no">0</b><span>no asisten</span></div>
  </section>

  <section class="panel">
    <h2 id="formTitle">Agregar invitado</h2>
    <form class="add" id="addForm" novalidate>
      <div class="name"><label>Nombre
        <input id="fName" maxlength="60" autocomplete="off" required></label></div>
      <div><label>Personas
        <input id="fCount" type="number" min="1" max="20" value="1"></label></div>
      <div><label>Estado
        <select id="fStatus">
          <option value="confirmado">Confirmado</option>
          <option value="pendiente">Pendiente</option>
          <option value="no asiste">No asiste</option>
        </select></label></div>
      <div class="full"><label>Nota (opcional)
        <input id="fNote" maxlength="140" placeholder="Ej.: trae pañales etapa 2, llega tarde…"></label></div>
      <div class="row-actions">
        <button type="button" class="btn" id="cancelEdit" hidden>Cancelar</button>
        <button type="submit" class="btn primary" id="saveBtn">Agregar a la lista</button>
      </div>
    </form>
    <details class="paste">
      <summary>Pegar una confirmación de WhatsApp</summary>
      <p>Pega el mensaje que llegó desde la invitación y se llenan el nombre y las personas.</p>
      <textarea id="pasteBox" placeholder="¡Hola! Soy Laura y confirmo mi asistencia… Vamos 2 personas."></textarea>
    </details>
  </section>

  <section class="panel">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Buscar por nombre" aria-label="Buscar por nombre">
      <div class="chips" role="group" aria-label="Filtrar por estado">
        <button class="chip" data-f="todos" aria-pressed="true">Todos</button>
        <button class="chip" data-f="confirmado" aria-pressed="false">Confirmados</button>
        <button class="chip" data-f="pendiente" aria-pressed="false">Pendientes</button>
        <button class="chip" data-f="no asiste" aria-pressed="false">No asisten</button>
      </div>
    </div>
    <ul class="list" id="list"></ul>
    <div class="foot">
      <small id="countLabel"></small>
      <button class="btn" id="exportBtn" hidden>Descargar lista (CSV)</button>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let guests = [];            // {id, name, count, status, note, createdAt}
  let filter = "todos", query = "", editing = null;
  let store = null;           // adaptador db o local

  const banner = msg => { const b=$("banner"); b.textContent = msg||""; b.classList.toggle("show", !!msg); };

  // ---------- Almacenamiento ----------
  // URL de la aplicación web de Apps Script (termina en /exec). Vacío = solo este navegador.
  const SHEETS_URL = "https://script.google.com/macros/s/AKfycbxSalSOM3v_h3V2Q9153FmoU3V5FfJfziS-zkE9kkwg7adBx5_W97tTfYUfAM11mkQeHw/exec";
  const KEY_STORE = "evangeline-admin-key";
  const REFRESH_MS = 30000;

  const local = {
    key: "evangeline-guests",
    load(){ try { return JSON.parse(localStorage.getItem(this.key)) || []; } catch { return []; } },
    save(){ try { localStorage.setItem(this.key, JSON.stringify(guests)); } catch {} },
    async put(g){ const i = guests.findIndex(x=>x.id===g.id); i>=0 ? guests[i]=g : guests.push(g); this.save(); render(); },
    async remove(id){ guests = guests.filter(x=>x.id!==id); this.save(); render(); }
  };

  function useLocal(msg){
    store = local; guests = local.load(); render();
    banner(msg || "La lista se está guardando solo en este navegador.");
  }

  // Google Sheets
  const getKey = () => { try { return localStorage.getItem(KEY_STORE) || ""; } catch { return ""; } };
  const setKey = k => { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch {} };
  let adminKey = "", timer = null;

  async function api(action, extra){
    const res = await fetch(SHEETS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, key: adminKey, ...extra })
    });
    const data = await res.json();
    if (!data.ok) { const e = new Error(data.error || "error"); e.code = data.error; throw e; }
    return data;
  }

  const sheets = {
    async load(){
      const { guests: rows } = await api("list");
      guests = rows.map(g => ({ ...g, count: +g.count || 1 }));
      render();
    },
    async put(g){
      const i = guests.findIndex(x=>x.id===g.id); i>=0 ? guests[i]=g : guests.push(g); render();
      const { guest } = await api("put", { guest: g });
      const j = guests.findIndex(x=>x.id===g.id); if (j>=0) guests[j] = { ...guests[j], ...guest };
      render();
    },
    async remove(id){
      guests = guests.filter(x=>x.id!==id); render();
      await api("remove", { id });
    }
  };

  const offline = { async put(){ throw new Error("sin conexión"); }, async remove(){ throw new Error("sin conexión"); } };

  function setConnected(on){
    $("syncState").dataset.on = String(on);
    $("syncState").textContent = on ? "Conectada a Google Sheets" : "Sin conectar a Google Sheets";
    $("keyForm").hidden = on; $("syncActs").hidden = !on;
  }

  async function connect(key){
    adminKey = key;
    try {
      await sheets.load();
      setKey(key); store = sheets; setConnected(true); banner("");
      clearInterval(timer);
      timer = setInterval(() => { if (!document.hidden && !editing) sheets.load().catch(()=>{}); }, REFRESH_MS);
    } catch (e) {
      adminKey = ""; setConnected(false);
      if (e.code === "unauthorized") { setKey(""); banner("La clave no es correcta."); }
      else if (e.code === "admin_key_not_configured") banner("Falta configurar ADMIN_KEY en las propiedades del script.");
      else banner("No se pudo conectar con Google Sheets. Revisa tu conexión e inténtalo otra vez.");
      guests = []; render();
    }
  }

  async function init(){
    render();
    if (!SHEETS_URL){ useLocal(); return; }
    $("syncPanel").hidden = false;
    store = offline;
    $("keyForm").addEventListener("submit", e => {
      e.preventDefault();
      const k = $("keyInput").value.trim(); if (!k) { $("keyInput").focus(); return; }
      $("keyInput").value = ""; connect(k);
    });
    $("refreshBtn").onclick = () => sheets.load().then(()=>banner("")).catch(()=>banner("No se pudo actualizar la lista."));
    $("forgetBtn").onclick = () => { setKey(""); adminKey = ""; clearInterval(timer); guests = []; render(); setConnected(false); store = offline; banner("Escribe la clave de anfitrión para ver y editar la lista."); };
    document.addEventListener("visibilitychange", () => { if (!document.hidden && store === sheets) sheets.load().catch(()=>{}); });
    const saved = getKey();
    if (saved) connect(saved);
    else banner("Escribe la clave de anfitrión para ver y editar la lista.");
  }

  // ---------- Formulario ----------
  const form = $("addForm");
  function resetForm(){
    form.reset(); $("fCount").value = 1; editing = null;
    $("formTitle").textContent = "Agregar invitado";
    $("saveBtn").textContent = "Agregar a la lista";
    $("cancelEdit").hidden = true;
  }
  $("cancelEdit").onclick = resetForm;

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("fName").value.trim().replace(/\s+/g," ");
    if (!name){ banner("Escribe el nombre del invitado."); $("fName").focus(); return; }
    const count = Math.min(20, Math.max(1, parseInt($("fCount").value,10) || 1));
    const dup = guests.find(g => g.name.toLowerCase() === name.toLowerCase() && g.id !== editing);
    if (dup && !confirm(`${dup.name} ya está en la lista. ¿Agregarlo de nuevo?`)) return;
    const base = editing ? guests.find(g=>g.id===editing) : null;
    const g = {
      id: editing || ("g" + Date.now().toString(36) + Math.random().toString(36).slice(2,6)),
      name, count, status: $("fStatus").value, note: $("fNote").value.trim(),
      createdAt: base?.createdAt || Date.now(), updatedAt: Date.now()
    };
    $("saveBtn").disabled = true;
    try { await store.put(g); banner(""); resetForm(); $("fName").focus(); }
    catch { banner("No se pudo guardar. Revisa tu conexión e inténtalo otra vez."); if (store === sheets) sheets.load().catch(()=>{}); }
    finally { $("saveBtn").disabled = false; }
  });

  // Pegar mensaje de WhatsApp
  $("pasteBox").addEventListener("input", e => {
    const t = e.target.value;
    const n = t.match(/soy\s+(.+?)\s+y\s+confirmo/i);
    const c = t.match(/vamos\s+(\d+)/i);
    if (n){ $("fName").value = n[1].trim(); $("fStatus").value = "confirmado"; }
    if (c){ $("fCount").value = c[1]; }
    if (n || c) banner(""); 
  });

  // ---------- Lista ----------
  document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
    filter = ch.dataset.f;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c===ch));
    render();
  });
  $("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });

  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function render(){
    const conf = guests.filter(g=>g.status==="confirmado");
    $("t-people").textContent = conf.reduce((a,g)=>a+(+g.count||1),0);
    $("t-pending").textContent = guests.filter(g=>g.status==="pendiente").length;
    $("t-no").textContent = guests.filter(g=>g.status==="no asiste").length;

    const shown = guests
      .filter(g => filter==="todos" || g.status===filter)
      .filter(g => !query || g.name.toLowerCase().includes(query))
      .sort((a,b) => a.name.localeCompare(b.name, "es"));

    const list = $("list");
    if (!guests.length){
      list.innerHTML = `<li class="empty" style="display:block">Todavía no hay invitados. Agrega el primero arriba o pega una confirmación de WhatsApp.</li>`;
    } else if (!shown.length){
      list.innerHTML = `<li class="empty" style="display:block">Nadie coincide con ese filtro.</li>`;
    } else {
      list.innerHTML = shown.map(g => `
        <li data-id="${esc(g.id)}">
          <div class="who">${esc(g.name)}<small>${g.count} ${g.count==1?"persona":"personas"}</small></div>
          ${g.note ? `<div class="note">${esc(g.note)}</div>` : ""}
          <div class="ctrls">
            <select class="status" data-s="${esc(g.status)}" aria-label="Estado de ${esc(g.name)}">
              ${["confirmado","pendiente","no asiste"].map(s=>`<option value="${s}" ${s===g.status?"selected":""}>${s[0].toUpperCase()+s.slice(1)}</option>`).join("")}
            </select>
            <button class="icon" data-act="edit" aria-label="Editar ${esc(g.name)}">✏️</button>
            <button class="icon" data-act="del" aria-label="Quitar ${esc(g.name)}">🗑️</button>
          </div>
        </li>`).join("");
    }
    const totalPeople = guests.filter(g=>g.status!=="no asiste").reduce((a,g)=>a+(+g.count||1),0);
    $("countLabel").textContent = guests.length ? `${guests.length} registros · ${totalPeople} personas esperadas (confirmadas + pendientes)` : "";
  }

  $("list").addEventListener("change", async e => {
    if (!e.target.classList.contains("status")) return;
    const id = e.target.closest("li").dataset.id;
    const g = guests.find(x=>x.id===id); if (!g) return;
    try { await store.put({ ...g, status:e.target.value, updatedAt:Date.now() }); }
    catch { banner("No se pudo cambiar el estado. Inténtalo otra vez."); render(); }
  });

  $("list").addEventListener("click", async e => {
    const btn = e.target.closest("button[data-act]"); if (!btn) return;
    const id = btn.closest("li").dataset.id;
    const g = guests.find(x=>x.id===id); if (!g) return;
    if (btn.dataset.act === "edit"){
      editing = id;
      $("fName").value = g.name; $("fCount").value = g.count; $("fStatus").value = g.status; $("fNote").value = g.note || "";
      $("formTitle").textContent = "Editar invitado";
      $("saveBtn").textContent = "Guardar cambios";
      $("cancelEdit").hidden = false;
      form.scrollIntoView({ behavior:"smooth", block:"center" }); $("fName").focus();
    } else if (confirm(`¿Quitar a ${g.name} de la lista?`)){
      try { await store.remove(id); } catch { banner("No se pudo quitar. Inténtalo otra vez."); }
    }
  });

  // ---------- Exportar ----------
  $("exportBtn").hidden = false;
  $("exportBtn").onclick = () => {
    const rows = [["Nombre","Personas","Estado","Nota"], ...guests.slice().sort((a,b)=>a.name.localeCompare(b.name,"es")).map(g=>[g.name,g.count,g.status,g.note||""])];
    const cell = v => { v = String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return `"${v.replace(/"/g,'""')}"`; };
    const csv = "﻿" + rows.map(r => r.map(cell).join(";")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv;charset=utf-8" }));
    a.download = "invitados-evangeline.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  init();
})();
</script>
</body>
</html>
